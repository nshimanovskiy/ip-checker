# /etc/nginx/sites-available/ip.sdsds.top
# Сайт за Cloudflare: реальный IP берётся из CF-Connecting-IP, но только от адресов Cloudflare.
# Список адресов создаётся скриптом deploy/update-cloudflare-ips.sh (см. README).
server {
    listen 80;
    listen [::]:80;
    server_name ip.sdsds.top ipv4.sdsds.top ipv6.sdsds.top;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    location / {
        proxy_pass http://127.0.0.1:3077;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
