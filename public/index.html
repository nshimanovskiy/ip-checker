<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой IP — ip.sdsds.top</title>
<meta name="description" content="Узнать свой IPv4 и IPv6 адрес и страну">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #f4f6fb; --card: #ffffff; --text: #0f172a; --muted: #64748b;
    --line: #e2e8f0; --accent: #0284c7; --accent-soft: #e0f2fe; --err: #dc2626;
    --ok: #059669; --ok-soft: #d1fae5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1120; --card: #111a2e; --text: #e2e8f0; --muted: #8b9ab3;
      --line: #1e2a44; --accent: #38bdf8; --accent-soft: #0c2a40; --err: #f87171;
      --ok: #34d399; --ok-soft: #063a2c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; padding: 32px 16px;
  }
  main { width: 100%; max-width: 760px; }
  h1 { font-size: 20px; margin: 0 0 16px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 22px; box-shadow: 0 10px 30px rgba(15, 23, 42, .05); min-width: 0;
  }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  .badge {
    font-size: 12px; padding: 2px 8px; border-radius: 999px;
    background: var(--ok-soft); color: var(--ok); font-weight: 600;
  }
  .ip {
    font: 600 22px/1.25 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    word-break: break-all; margin: 8px 0 4px;
  }
  .card.v6 .ip { font-size: 18px; }
  .copy {
    font: inherit; font-size: 13px; cursor: pointer; border: 0; background: none;
    color: var(--accent); padding: 0;
  }
  .country {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-top: 14px;
    border-radius: 12px; background: var(--accent-soft);
  }
  .flag { font-size: 32px; line-height: 1; }
  .cname { font-weight: 600; }
  .ccode { color: var(--muted); font-size: 13px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 14px 0 0; font-size: 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; text-align: right; word-break: break-word; }
  .none { color: var(--muted); margin-top: 10px; font-size: 15px; }
  .skeleton { opacity: .45; }
  .check { margin-top: 16px; }
  form { display: flex; gap: 8px; }
  input {
    flex: 1; min-width: 0; font: 15px ui-monospace, Menlo, Consolas, monospace;
    padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--text);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button.go {
    font: inherit; font-size: 14px; cursor: pointer; border-radius: 10px; border: 1px solid var(--line);
    background: var(--accent-soft); color: var(--accent); padding: 8px 14px;
  }
  button.go:hover { border-color: var(--accent); }
  .err { color: var(--err); margin-top: 10px; font-size: 14px; }
  #lookup:empty { display: none; }
  .foot { text-align: center; color: var(--muted); font-size: 13px; margin-top: 18px; }
  .foot a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Ваш IP-адрес</h1>
  <div class="grid">
    <section class="card v4" id="c4"></section>
    <section class="card v6" id="c6"></section>
  </div>

  <section class="card check">
    <form id="form" autocomplete="off">
      <input id="q" placeholder="Проверить любой IPv4 или IPv6" spellcheck="false" aria-label="IP-адрес">
      <button class="go" type="submit">Проверить</button>
    </form>
    <div id="lookup"></div>
  </section>

  <div class="foot">Данные: <a href="https://ipinfo.io" rel="noopener noreferrer" target="_blank">ipinfo.io</a>, <a href="https://www.ipify.org" rel="noopener noreferrer" target="_blank">ipify</a> ·
    <code>curl -4 ip.sdsds.top/raw</code> · <code>curl -6 ip.sdsds.top/raw</code></div>
</main>

<script>
(() => {
  const V4 = '__V4_URL__';
  const V6 = '__V6_URL__';
  const $ = id => document.getElementById(id);
  let names = null;
  try { names = new Intl.DisplayNames(['ru'], { type: 'region' }); } catch {}

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const flagOf = cc => /^[A-Z]{2}$/.test(cc || '')
    ? String.fromCodePoint(...[...cc].map(c => 0x1F1E6 + c.charCodeAt(0) - 65)) : '🌐';
  const errText = e => ({ invalid_ip: 'Это не похоже на IP-адрес',
    too_many_requests: 'Слишком много запросов, подождите минуту',
    lookup_failed: 'ipinfo не ответил, попробуйте позже' }[e] || 'Ошибка');

  function infoHtml(d) {
    if (d.bogon) return `<div class="country"><span class="flag">🏠</span><div><div class="cname">Локальный / зарезервированный адрес</div></div></div>`;
    const cname = d.country ? ((names && names.of(d.country)) || d.country) : 'Страна неизвестна';
    const row = (k, v) => `<dt>${k}</dt><dd>${esc(v || '—')}</dd>`;
    return `<div class="country"><span class="flag">${flagOf(d.country)}</span>
        <div><div class="cname">${esc(cname)}</div><div class="ccode">${esc(d.country || '')}</div></div></div>
      <dl>${row('Город', d.city)}${row('Регион', d.region)}${row('Провайдер', d.org)}${row('Часовой пояс', d.timezone)}</dl>`;
  }

  function card(el, title, state, primary) {
    let body;
    if (state === 'loading') body = `<div class="ip skeleton">…</div>`;
    else if (state.none) body = `<div class="none">${esc(state.none)}</div>`;
    else body = `<div class="ip">${esc(state.ip)}</div>
      <button class="copy" type="button" data-ip="${esc(state.ip)}">Копировать</button>
      ${state.error ? `<div class="err">${esc(errText(state.error))}</div>` : infoHtml(state)}`;
    el.innerHTML = `<div class="head"><span class="label">${title}</span>
      ${primary ? '<span class="badge" title="Этот протокол браузер использует по умолчанию">основной</span>' : ''}</div>${body}`;
  }

  async function get(url) {
    const r = await fetch(url, { cache: 'no-store' });
    return r.json();
  }

  // Узнать свой IP через хост одного протокола, затем страну — через наш сервер
  async function viaFamily(url, fam) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 4000);
    try {
      const r = await fetch(url, { cache: 'no-store', signal: ctl.signal });
      const { ip } = await r.json();
      const isV6 = String(ip).includes(':');
      if (!ip || isV6 !== (fam === 6)) return null;
      return get('/api/ip?ip=' + encodeURIComponent(ip));
    } finally { clearTimeout(t); }
  }

  async function init() {
    card($('c4'), 'IPv4', 'loading'); card($('c6'), 'IPv6', 'loading');
    const [main, v4, v6] = await Promise.allSettled([get('/api/ip'), viaFamily(V4, 4), viaFamily(V6, 6)]);
    const m = main.status === 'fulfilled' ? main.value : null;
    const primary = m && m.family;

    let r4 = v4.status === 'fulfilled' && v4.value && v4.value.ip ? v4.value : (m && m.family === 4 ? m : null);
    let r6 = v6.status === 'fulfilled' && v6.value && v6.value.ip ? v6.value : (m && m.family === 6 ? m : null);

    card($('c4'), 'IPv4', r4 || { none: 'IPv4 не обнаружен' }, primary === 4);
    card($('c6'), 'IPv6', r6 || { none: 'IPv6 не обнаружен — ваш провайдер или сеть его не поддерживает' }, primary === 6);

    const t = (r4 || r6 || {});
    if (t.ip) document.title = t.ip + (t.country ? ' · ' + t.country : '') + ' — ip.sdsds.top';
  }

  document.addEventListener('click', async e => {
    const b = e.target.closest('.copy');
    if (!b) return;
    try {
      await navigator.clipboard.writeText(b.dataset.ip);
      b.textContent = 'Скопировано';
      setTimeout(() => b.textContent = 'Копировать', 1500);
    } catch {}
  });

  $('form').onsubmit = async e => {
    e.preventDefault();
    const v = $('q').value.trim();
    if (!v) return;
    const out = $('lookup');
    out.innerHTML = `<div class="ip skeleton">…</div>`;
    try {
      const r = await fetch('/api/ip?ip=' + encodeURIComponent(v));
      const d = await r.json();
      if (!r.ok) { out.innerHTML = `<div class="err">${esc(errText(d.error))}</div>`; return; }
      out.innerHTML = `<div class="head" style="margin-top:16px"><span class="label">IPv${d.family}</span></div>
        <div class="ip">${esc(d.ip)}</div>${infoHtml(d)}`;
    } catch { out.innerHTML = `<div class="err">Нет соединения с сервером</div>`; }
  };

  init();
})();
</script>
</body>
</html>
